# Autoscale between 2 and 6 pods on CPU (needs metrics-server: `minikube addons enable metrics-server`)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-webapp
  namespace: devops-webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-webapp
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
