# Start Jenkins locally:  cd jenkins && docker compose up -d --build  ->  http://localhost:8080
# Before starting: copy .env.example to .env and fill in your own values.
# Jenkins is fully configured by casc.yaml (admin user, credentials, pipeline job) - no setup wizard.
services:
  jenkins:
    build: .
    image: devops-jenkins:local
    container_name: jenkins
    user: root            # lets Jenkins use the host Docker socket (fine for a lab; don't do this in production)
    ports:
      - "127.0.0.1:8080:8080"   # only reachable from this PC
    env_file: .env
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc/jenkins.yaml
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc/jenkins.yaml:ro
      - ./kubeconfig:/run/secrets/kubeconfig:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
