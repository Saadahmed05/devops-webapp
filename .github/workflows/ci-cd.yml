name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: saadahmed05
  IMAGE: saadahmed05/devops-webapp

jobs:
  # ---------------- 1. Continuous Integration ----------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage

  # ---------------- 2. Build & push Docker image ----------------
  docker:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 10); do curl -fs http://localhost:3000/health && exit 0; sleep 2; done
          docker logs smoke; exit 1

  # ---------------- 3. Continuous Deployment to Kubernetes ----------------
  # Deploys to a throw-away Kubernetes cluster (kind) inside the GitHub runner to
  # prove the image + manifests deploy and serve traffic. Jenkins deploys the same
  # image to the local Docker Desktop cluster.
  deploy:
    name: Deploy to Kubernetes
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Apply manifests & roll out new image
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n devops-webapp set image deployment/devops-webapp web=${{ env.IMAGE }}:${{ needs.docker.outputs.tag }}
          kubectl -n devops-webapp rollout status deployment/devops-webapp --timeout=180s
          kubectl -n devops-webapp get pods,svc -o wide

      - name: Verify the app responds inside the cluster
        run: |
          kubectl -n devops-webapp port-forward svc/devops-webapp 8080:80 &
          sleep 5
          curl -fs http://localhost:8080/health
          curl -fs http://localhost:8080/api/info

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl -n devops-webapp describe pods || true
          kubectl -n devops-webapp rollout undo deployment/devops-webapp || true
